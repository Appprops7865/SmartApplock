name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # This creates a dummy configuration layout if your folder upload was nested
    - name: Auto-Fix Missing Settings Files
      run: |
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "No settings.gradle found in root. Generating defaults..."
          echo "include ':app'" > settings.gradle
        fi
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo "No build.gradle found in root. Creating initialization fallback..."
          echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug || echo "Falling back to subfolder attempt..."

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smartlock-apk
        path: "**/build/outputs/apk/debug/*.apk" # Search all folders safely for the generated file
